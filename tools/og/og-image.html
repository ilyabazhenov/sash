    radial-gradient(circle closest-side, #28C840 92%, transparent) .34em 0 / .1em .1em no-repeat;
}
p { margin: 36px 0 0; font-size: 30px; line-height: 1.35; color: #4A5468; }
.art svg { width: 360px; height: 360px; border-radius: 80px; box-shadow: 0 40px 60px -30px rgba(17, 22, 32, .45); display: block; }
html:not(.en) .en, html.en .ru { display: none; }
